name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  AUTH_SECRET: ci-placeholder-auth-secret-min-32-chars!!
  AUTH_URL: http://localhost:3000
  DATABASE_URL: postgres://grainydays:grainydays_dev@localhost:5432/grainydays
  DATABASE_URL_TEST: postgres://grainydays:grainydays_dev@localhost:5432/grainydays_test
  CI_DISCORD_CLIENT_ID: "123456789012345678"
  CI_DISCORD_CLIENT_SECRET: ci-placeholder-discord-secret

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: grainydays
          POSTGRES_PASSWORD: grainydays_dev
          POSTGRES_DB: grainydays
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U grainydays -d grainydays"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Create test database
        env:
          PGPASSWORD: grainydays_dev
        run: |
          psql -h localhost -U grainydays -d grainydays -tc "SELECT 1 FROM pg_database WHERE datname = 'grainydays_test'" | grep -q 1 || \
          psql -h localhost -U grainydays -d grainydays -c "CREATE DATABASE grainydays_test"

      - run: npm ci

      - name: Migrate main database
        run: npm run db:migrate

      - name: Migrate test database
        env:
          DATABASE_URL: ${{ env.DATABASE_URL_TEST }}
        run: npm run db:migrate

      - run: npm test

      - name: Integration tests
        env:
          RUN_INTEGRATION_TESTS: "1"
        run: npm run test:integration

      - run: npm run lint

      - name: Production build
        env:
          DISCORD_CLIENT_ID: ${{ env.CI_DISCORD_CLIENT_ID }}
          DISCORD_CLIENT_SECRET: ${{ env.CI_DISCORD_CLIENT_SECRET }}
        run: npm run build

  docker:
    needs: test
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest

    env:
      AUTH_SECRET: ci-placeholder-auth-secret-min-32-chars!!
      AUTH_URL: http://localhost:3000
      DATABASE_URL: postgres://grainydays:grainydays_dev@localhost:5432/grainydays
      DISCORD_CLIENT_ID: "123456789012345678"
      DISCORD_CLIENT_SECRET: ci-placeholder-discord-secret

    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,prefix=sha-,format=short
            type=semver,pattern={{version}},enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=semver,pattern={{major}}.{{minor}},enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=semver,pattern={{major}},enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            AUTH_SECRET=${{ env.AUTH_SECRET }}
            AUTH_URL=${{ env.AUTH_URL }}
            DISCORD_CLIENT_ID=${{ env.DISCORD_CLIENT_ID }}
            DISCORD_CLIENT_SECRET=${{ env.DISCORD_CLIENT_SECRET }}
            DATABASE_URL=${{ env.DATABASE_URL }}
