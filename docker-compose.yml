services:
  postgres:
    image: postgres:15-alpine
    container_name: grainydays-db
    environment:
      POSTGRES_DB: grainydays
      POSTGRES_USER: grainydays
      POSTGRES_PASSWORD: grainydays_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U grainydays -d grainydays"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: grainydays-app
    ports:
      - "3000:3000"
    volumes:
      - .:/app:Z
      - /app/node_modules
      - /app/.next
    env_file:
      - path: .env.local
        required: false
    environment:
      - DATABASE_URL=postgres://grainydays:grainydays_dev@postgres:5432/grainydays
      - AUTH_URL=http://localhost:3000
      - AUTH_SECRET=${AUTH_SECRET:-dev-only-set-AUTH_SECRET-in-env-local}
      - DISCORD_CLIENT_ID=${DISCORD_CLIENT_ID:-}
      - DISCORD_CLIENT_SECRET=${DISCORD_CLIENT_SECRET:-}
      - NODE_ENV=development
      - WATCHPACK_POLLING=${WATCHPACK_POLLING:-true}
    depends_on:
      postgres:
        condition: service_healthy
    command: npm run dev:docker

volumes:
  postgres_data:
